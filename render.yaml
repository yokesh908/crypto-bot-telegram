services:
  - type: worker
    name: crypto-bot
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: telegram-bot/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_CHANNEL
        sync: false
      - key: TELEGRAM_STRING_SESSION
        sync: false
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
      - key: EXCHANGE_PROVIDER
        value: paper
      - key: MODE
        value: paper
      - key: TRADE_CAPITAL_INR
        value: "30000"
      - key: DEFAULT_SL_PERCENT
        value: "2.0"
      - key: DEFAULT_TARGET_PERCENT
        value: "2.0"
      - key: MAX_SL_PERCENT
        value: "25"
      - key: MAX_SL_POINTS
        value: "12"
      - key: MIN_SL_POINTS
        value: "5"
      - key: BREAKEVEN_AT_T1
        value: "1"
      - key: TRAIL_TO_T1_AT_T2
        value: "1"
      - key: MAX_RISK_PER_TRADE_INR
        value: "1500"
      - key: TARGET_PRIORITY
        value: "T1,T2,T3"
      - key: HISTORY_BACKFILL
        value: "0"
      - key: SL_OFFSET_POINTS
        value: "20"
      - key: SIGNAL_MAX_AGE_MINUTES
        value: "10"
      - key: SIGNAL_DEDUP_WINDOW_SEC
        value: "600"
      - key: BOT_MAX_RESTARTS
        value: "100000"
      - key: BOT_RESTART_DELAY_SEC
        value: "15"
